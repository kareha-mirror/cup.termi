version: "3"
env:
  CGO_ENABLED: 0
tasks:
  default:
    cmds:
      - go build ./cmd/termi
      - go build . ./copi ./lock ./pity ./rbuf ./rkind ./rutil ./shutil ./suspend ./tmux
  clean:
    cmds:
      - go run ./cmd/rm termi
      - go run ./cmd/rm termi.exe
  test:
    cmds:
      - go test ./...
  run:
    cmds:
      - go run ./cmd/termi
  fmt:
    cmds:
      - go fmt ./...
  vet:
    cmds:
      - go vet ./...
  check:
    cmds:
      - staticcheck ./...
  windows:
    env:
      GOOS: windows
      GOARCH: amd64
    cmds:
      - go build -o termi.exe ./cmd/termi
      - go build . ./copi ./lock ./pity ./rbuf ./rkind ./rutil ./shutil ./suspend ./tmux
