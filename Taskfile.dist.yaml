version: "3"
env:
  CGO_ENABLED: 0
tasks:
  default:
    cmds:
      - go build ./cmd/termi
      - go build . ./lock ./pity ./rbuf ./rkind ./rutil ./shutil ./suspend ./tmux
  clean:
    cmds:
      - rm -f termi
      - rm -f termi.exe
  test:
    cmds:
      - go test ./...
  run:
    cmds:
      - go run ./cmd/termi
  fmt:
    cmds:
      - go fmt ./...
  windows:
    env:
      GOOS: windows
      GOARCH: amd64
    cmds:
      - go build -o termi.exe ./cmd/termi
      - go build . ./lock ./pity ./rbuf ./rkind ./rutil ./shutil ./suspend ./tmux
